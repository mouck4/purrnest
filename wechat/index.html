<style>
:root{
  --coral:#FF7A59; --coral-d:#E85F3D; --ink:#2B211D; --ink-2:#6B5A52;
  --bg:#FFF9F4; --card:#fff; --line:#F0E2D8; --mint:#7FD3C0; --butter:#FFD469;
  --radius:16px; --shadow:0 6px 22px rgba(63,40,28,.08);
  --font:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);line-height:1.65;font-size:16px;
     -webkit-font-smoothing:antialiased;padding-bottom:64px;overflow-x:hidden}
img{max-width:100%;display:block;border:0}
a{color:inherit;text-decoration:none}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
.ann{background:var(--ink);color:#FFF3EC;font-size:12.5px;line-height:1.5;padding:8px 16px;text-align:center}
.ann strong{color:var(--butter)}
header.top{position:sticky;top:0;z-index:30;background:rgba(255,249,244,.94);backdrop-filter:saturate(1.6) blur(10px);
  border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:9px 16px}
header.top .logo{width:34px;height:34px;flex:0 0 34px}
header.top .logo svg{width:100%;height:100%}
.brand{font-weight:800;font-size:16.5px;letter-spacing:.2px}
.brand small{display:block;font-weight:500;font-size:11px;color:var(--ink-2);letter-spacing:.4px}
.langbtn{margin-left:auto;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;
  padding:6px 13px;font-size:13px;font-weight:700}
.hero{padding:20px 0 6px}
.cover{border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);background:#fff}
.cover img{width:100%;height:auto}
h1{font-size:25px;line-height:1.32;margin:16px 0 8px;letter-spacing:-.2px}
h1 em{font-style:normal;color:var(--coral)}
.lede{color:var(--ink-2);font-size:14.5px;margin:0 0 14px}
.cta{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0 10px}
.btn{flex:1 1 auto;min-width:140px;text-align:center;border-radius:999px;padding:13px 18px;font-weight:800;font-size:15px;
  border:1px solid transparent}
.btn.primary{background:var(--coral);color:#fff;box-shadow:0 8px 20px rgba(255,122,89,.32)}
.btn.ghost{background:#fff;color:var(--ink);border-color:var(--line)}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 0;padding:0;list-style:none}
.badges li{font-size:11.5px;font-weight:700;color:#5C4A42;background:#fff;border:1px solid var(--line);
  border-radius:999px;padding:5px 10px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:20px 0 4px;padding:0;list-style:none}
.stats li{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.stats b{display:block;font-size:20px;color:var(--coral-d);line-height:1.2}
.stats span{font-size:12px;color:var(--ink-2)}
section{padding:26px 0 4px}
h2{font-size:19px;margin:0 0 4px;letter-spacing:-.1px}
h2+.sub{color:var(--ink-2);font-size:13.5px;margin:0 0 14px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
.card .art{aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;padding:6px}
.card .art svg{width:100%;height:100%}
.card .bd{padding:10px 12px 13px}
.card h3{font-size:14.5px;margin:0 0 3px;line-height:1.35}
.card p{margin:0;font-size:12.5px;color:var(--ink-2);line-height:1.5}
.pill{display:inline-block;font-size:11px;font-weight:800;color:#fff;background:var(--coral);border-radius:999px;
  padding:2px 8px;margin-bottom:6px}
.price{display:flex;align-items:baseline;gap:6px;margin-top:8px}
.price b{font-size:16px;color:var(--coral-d)}
.price s{font-size:12px;color:#A9978E}
.meta{font-size:11.5px;color:var(--ink-2);margin-top:5px;border-top:1px dashed var(--line);padding-top:6px}
.why{display:grid;gap:10px}
.why .item{display:flex;gap:11px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 13px}
.why .ico{flex:0 0 30px;width:30px;height:30px;color:var(--coral)}
.why .ico svg{width:100%;height:100%}
.why h4{margin:0 0 2px;font-size:14.5px}
.why p{margin:0;font-size:12.5px;color:var(--ink-2)}
ol.flow{margin:0;padding:0;list-style:none;counter-reset:s}
ol.flow li{position:relative;background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px 13px 11px 46px;margin-bottom:9px;font-size:13.5px}
ol.flow li:before{counter-increment:s;content:counter(s);position:absolute;left:12px;top:11px;width:24px;height:24px;
  border-radius:50%;background:var(--coral);color:#fff;font-size:12.5px;font-weight:800;display:flex;align-items:center;justify-content:center}
ol.flow b{display:block;font-size:14px}
ol.flow span{color:var(--ink-2);font-size:12.5px}
details{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:9px}
details summary{font-weight:700;font-size:14.5px;cursor:pointer;list-style:none}
details summary::-webkit-details-marker{display:none}
details summary:after{content:"＋";float:right;color:var(--coral);font-weight:800}
details[open] summary:after{content:"－"}
details p{margin:9px 0 0;font-size:13px;color:var(--ink-2)}
.contact{display:grid;gap:10px}
.crow{display:flex;align-items:center;gap:11px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.crow .ico{flex:0 0 26px;width:26px;height:26px;color:var(--coral)}
.crow .ico svg{width:100%;height:100%}
.crow .t{font-size:11.5px;color:var(--ink-2)}
.crow .v{font-size:14.5px;font-weight:700;word-break:break-all}
.crow button{margin-left:auto;border:1px solid var(--coral);color:var(--coral);background:#fff;border-radius:999px;
  padding:6px 12px;font-size:12.5px;font-weight:800}
.qr{background:#fff;border:1px dashed var(--line);border-radius:14px;padding:14px;text-align:center;color:var(--ink-2);font-size:12.5px}
.qr img{width:190px;height:190px;margin:0 auto 8px;object-fit:contain}
.tip{background:#FFF3EC;border:1px solid #FFD9CB;border-radius:14px;padding:11px 13px;font-size:12.5px;color:#8A5A46;margin-top:12px}
footer{margin-top:26px;padding:20px 0 8px;border-top:1px solid var(--line);color:var(--ink-2);font-size:12px;text-align:center}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;gap:8px;padding:8px 12px calc(8px + env(safe-area-inset-bottom));
  background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line)}
.bar a{flex:1;text-align:center;border-radius:999px;padding:11px 8px;font-size:14px;font-weight:800}
.bar a.p{background:var(--coral);color:#fff}
.bar a.g{background:#fff;color:var(--ink);border:1px solid var(--line)}
.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:rgba(43,33,29,.92);color:#fff;
  padding:9px 16px;border-radius:999px;font-size:13px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:60}
.toast.on{opacity:1}
@media (min-width:560px){ .grid{grid-template-columns:repeat(3,1fr)} .stats{grid-template-columns:repeat(4,1fr)} h1{font-size:30px} }
</style>
</head>

<script>/* ==========================================================================

(function (global) {
  "use strict";

  var uid = 0;

  /* ---------- palettes ---------- */
  var PALETTES = {
    peach:  { fabric: "#FFC7AE", fabricDark: "#F5A184", wood: "#E0AC7E", woodDark: "#C08A5B", accent: "#FFD469", bg: "#FFF1CE" },

    cream:  { fabric: "#F6E3CE", fabricDark: "#E8CDAF", wood: "#E0AC7E", woodDark: "#C08A5B", accent: "#FFB59A", bg: "#FBF3E9" }
  };

  var INK = "#3E2E28";
  var ROPE = "#F3E3C9";
  var CARDBOARD = "#DDB283";
  var PINK = "#FF9FB2";

  function p(name) { return PALETTES[name] || PALETTES.peach; }

  function open(extra) {
    var g = "pn" + (++uid);
    return {
      id: g,
      head:
        '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-hidden="true" ' +
        (extra ? " " + extra : "") + ">",

        '<defs>' +
        '<linearGradient id="w' + g + '" x1="0" y1="0" x2="1" y2="1">' +
        '<stop offset="0" stop-color="#E9BC91"/><stop offset="1" stop-color="#C68F5D"/></linearGradient>' +
        '<linearGradient id="f' + g + '" x1="0" y1="0" x2="0" y2="1">' +
        '<stop offset="0" stop-color="#fff" stop-opacity=".38"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>' +
        "</defs>"
    };
  }
  function close(o) { return o.head + o.defs + o.body + "</svg>"; }

  /* ---------- shared parts ---------- */
  function floor(y, w) {
    return '<ellipse cx="120" cy="' + (y || 212) + '" rx="' + (w || 92) + '" ry="9" fill="' + INK + '" opacity=".07"/>';
  }

  /* a rope-wrapped post with sisal rings */
  function post(x, y, w, h, pal) {
    var rings = "";
    var step = 13;
    for (var i = y + 8; i < y + h - 4; i += step) {
      rings += '<rect x="' + (x - 2) + '" y="' + i + '" width="' + (w + 4) + '" height="4.5" rx="2.2" fill="' + ROPE + '"/>';
    }
    return (
      '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '" rx="' + w / 2 + '" fill="url(#w' + pal + ')"/>' +
      rings
    );
  }

  function plank(x, y, w, h, pal) {
    return '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + (h || 12) + '" rx="' + (h || 12) / 2 + '" fill="url(#w' + pal + ')"/>' +
      '<rect x="' + (x + 6) + '" y="' + (y + 2) + '" width="' + (w - 12) + '" height="3" rx="1.5" fill="#fff" opacity=".3"/>';
  }

  /* a seated cat, anchored at the base (tail sits to the right) */
  function catSit(x, y, s, fill, accent) {
    accent = accent || PINK;
    return (
      '<g transform="translate(' + x + "," + y + ") scale(" + s + ')" fill="' + fill + '">' +
        '<path d="M22,2 C48,-6 56,-26 46,-38" stroke="' + fill + '" stroke-width="11" stroke-linecap="round" fill="none"/>' +
        '<path d="M-30,4 C-37,-34 -20,-62 0,-62 C20,-62 37,-34 30,4 Z"/>' +
        '<circle cx="0" cy="-78" r="27"/>' +
        '<path d="M-25,-90 L-30,-119 L-5,-101 Z"/>' +
        '<path d="M25,-90 L30,-119 L5,-101 Z"/>' +
        '<path d="M-19,-99 L-21,-111 L-9,-101 Z" fill="' + accent + '"/>' +
        '<path d="M19,-99 L21,-111 L9,-101 Z" fill="' + accent + '"/>' +
        '<path d="M-15,-80 q6,-8 12,0" stroke="' + INK + '" stroke-width="3" fill="none" stroke-linecap="round"/>' +
        '<path d="M3,-80 q6,-8 12,0" stroke="' + INK + '" stroke-width="3" fill="none" stroke-linecap="round"/>' +
        '<path d="M-4,-69 L4,-69 L0,-63 Z" fill="' + accent + '"/>' +
        '<ellipse cx="-18" cy="-66" rx="6" ry="3.6" fill="' + accent + '" opacity=".65"/>' +
        '<ellipse cx="18" cy="-66" rx="6" ry="3.6" fill="' + accent + '" opacity=".65"/>' +
        '<path d="M-13,-67 L-30,-71 M-13,-62 L-30,-58 M13,-67 L30,-71 M13,-62 L30,-58" stroke="' + INK + '" stroke-width="1.7" opacity=".45" stroke-linecap="round"/>' +
      "</g>"
    );
  }

  /* a cat head peeking out of a hole */
  function catPeek(cx, cy, r, fill, accent) {
    accent = accent || PINK;
    return (
      '<g fill="' + fill + '">' +
        '<path d="M' + (cx - r * 0.8) + "," + (cy - r * 0.6) + " L" + (cx - r * 1.05) + "," + (cy - r * 1.6) + " L" + (cx - r * 0.1) + "," + (cy - r * 1.05) + ' Z"/>' +
        '<path d="M' + (cx + r * 0.8) + "," + (cy - r * 0.6) + " L" + (cx + r * 1.05) + "," + (cy - r * 1.6) + " L" + (cx + r * 0.1) + "," + (cy - r * 1.05) + ' Z"/>' +
        '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '"/>' +
        '<path d="M' + (cx - r * 0.62) + "," + (cy - r * 0.82) + " L" + (cx - r * 0.72) + "," + (cy - r * 1.25) + " L" + (cx - r * 0.2) + "," + (cy - r * 0.95) + ' Z" fill="' + accent + '"/>' +
        '<path d="M' + (cx + r * 0.62) + "," + (cy - r * 0.82) + " L" + (cx + r * 0.72) + "," + (cy - r * 1.25) + " L" + (cx + r * 0.2) + "," + (cy - r * 0.95) + ' Z" fill="' + accent + '"/>' +
      "</g>" +
      '<circle cx="' + (cx - r * 0.36) + '" cy="' + cy + '" r="' + (r * 0.13) + '" fill="' + INK + '"/>' +
      '<circle cx="' + (cx + r * 0.36) + '" cy="' + cy + '" r="' + (r * 0.13) + '" fill="' + INK + '"/>' +
      '<path d="M' + (cx - r * 0.16) + "," + (cy + r * 0.42) + " L" + (cx + r * 0.16) + "," + (cy + r * 0.42) + " L" + cx + "," + (cy + r * 0.65) + ' Z" fill="' + PINK + '"/>'
    );
  }

  function paw(x, y, s, fill, op) {
    return (
      '<g transform="translate(' + x + "," + y + ") scale(" + s + ')" fill="' + fill + '" opacity="' + (op == null ? 0.5 : op) + '">' +

        '<ellipse cx="-9" cy="-7" rx="3.6" ry="4.6"/>' +
        '<ellipse cx="-3" cy="-11" rx="3.6" ry="4.6"/>' +
        '<ellipse cx="3" cy="-11" rx="3.6" ry="4.6"/>' +

  }

  function ball(x, y, r, fill) {
    return '<circle cx="' + x + '" cy="' + y + '" r="' + r + '" fill="' + fill + '"/>' +
      '<circle cx="' + (x - r * 0.3) + '" cy="' + (y - r * 0.35) + '" r="' + r * 0.26 + '" fill="#fff" opacity=".55"/>';
  }

  function plant(x, y, s, potFill, leafFill) {
    return (
      '<g transform="translate(' + x + "," + y + ") scale(" + s + ')">' +
        '<path d="M-20,10 C-22,-8 -14,-30 -2,-40 C-6,-22 -6,-4 -4,10 Z" fill="' + leafFill + '"/>' +
        '<path d="M4,10 C16,-6 20,-28 12,-42 C4,-26 0,-4 2,10 Z" fill="' + leafFill + '" opacity=".85"/>' +
        '<path d="M-8,10 C-4,-14 8,-6 14,-24" stroke="' + leafFill + '" stroke-width="3" fill="none" opacity=".7"/>' +
        '<path d="M-22,8 h44 l-6,30 a6,6 0 0 1 -6,5 h-20 a6,6 0 0 1 -6,-5 Z" fill="' + potFill + '"/>' +
        '<rect x="-24" y="4" width="48" height="9" rx="4.5" fill="' + potFill + '"/>' +
      "</g>"
    );
  }

  /* ======================================================================
     PRODUCT ILLUSTRATIONS
     ====================================================================== */

  var ART = {};

  /* --- 1. Tall floor-to-ceiling tower --- */
  ART.treeTall = function (name) {
    var c = p(name), o = open();
    o.body =
      floor(214, 78) +
      post(146, 92, 17, 112, o.id) +
      plank(60, 196, 120, 15, o.id) +
